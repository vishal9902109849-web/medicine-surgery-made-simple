<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin | Medicine & Surgery Made Simple by Vishal</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="wrap">
  <h1>Medicine &amp; Surgery Made Simple</h1>

  <section id="loginView" class="card">
    <h2>Admin Login</h2>
    <div id="loginMsg" class="msg" hidden></div>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit" id="loginBtn">Login</button>
    </form>
  </section>

  <section id="dashView" hidden>
    <div class="card">
      <div class="bar">
        <div><h2 style="margin:0">Dashboard</h2><small id="who"></small></div>
        <button type="button" id="logoutBtn" class="ghost">Logout</button>
      </div>
    </div>

    <div class="card">
      <h2>Upload Resource</h2>
      <div id="uploadMsg" class="msg" hidden></div>
      <form id="uploadForm">
        <label for="title">Title</label>
        <input id="title" maxlength="120" placeholder="e.g. Breast Mind Map" required>

        <label for="description">Description (optional)</label>
        <textarea id="description" rows="3" maxlength="500" placeholder="Short summary"></textarea>

        <label for="subject">Subject</label>
        <select id="subject">
          <option>Medicine</option>
          <option>Surgery</option>
        </select>

        <label for="type">Type</label>
        <select id="type">
          <option>Mind Maps</option>
          <option>Notes</option>
        </select>

        <label for="file">File (HTML, PDF or image, max 50 MB)</label>
        <input type="file" id="file" accept=".html,.htm,.pdf,.png,.jpg,.jpeg,.webp,.gif">

        <div id="progressWrap" class="progress" hidden>
          <div id="progressBar" class="progress-bar"></div>
          <span id="progressText">0%</span>
        </div>

        <button type="submit" id="publishBtn">Publish Resource</button>
      </form>
    </div>

    <div class="card">
      <h2>Manage Resources</h2>
      <div id="manageMsg" class="msg" hidden></div>
      <div id="manageList" class="mlist">Loading…</div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
