<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin | Medicine & Surgery Made Simple by vishal</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0f172a;
    color:white;
}

.container{
    max-width:600px;
    margin:40px auto;
    padding:25px;
    background:#1e293b;
    border-radius:15px;
}

h1{
    text-align:center;
}

input,select,textarea{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:18px;
    border-radius:10px;
    border:none;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}
</style>

</head>

<body>

<div class="container">

<h1>Medicine & Surgery Made Simple</h1>

<h3>Admin Upload Panel</h3>

<input id="title" placeholder="Title">

<textarea id="description"
placeholder="Description"></textarea>

<select id="subject">
<option>Medicine</option>
<option>Surgery</option>
</select>

<select id="type">
<option>Mind Maps</option>
<option>Notes</option>
</select>

<input type="file" id="file">

<button>
Publish Resource
</button>

</div>

</body>
</html>
