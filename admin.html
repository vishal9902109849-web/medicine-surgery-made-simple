<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin | Medicine & Surgery Made Simple by Vishal</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="wrap">
  <h1>Medicine &amp; Surgery Made Simple</h1>

  <section id="loginView" class="card">
    <h2>Admin Login</h2>
    <div id="loginMsg" class="msg" hidden></div>
    <form id="loginForm">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit" id="loginBtn">Login</button>
    </form>
  </section>

  <section id="dashView" class="card" hidden>
    <div class="bar">
      <div><h2 style="margin:0">Dashboard</h2><small id="who"></small></div>
      <button type="button" id="logoutBtn" class="ghost">Logout</button>
    </div>
    <p style="color:var(--muted)">Upload panel arrives in Step 2.</p>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
