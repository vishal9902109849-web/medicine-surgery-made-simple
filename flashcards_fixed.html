<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flashcards</title>
<style>
:root{--bg:#f2f5f7;--ink:#14232e;--muted:#5b6b76;--card:#fff;--line:#cfdae0;--accent:#58cc02;--accentd:#46a302;--bad:#ff4b4b;--badd:#ea2b2b;--hard:#ff9600;--easy:#1cb0f6}
html[data-theme=dark]{--bg:#131f24;--ink:#eef4f7;--muted:#9bb0ba;--card:#1f2f36;--line:#37464f}
body,#card,.dock,#end{transition:background .6s,color .6s,border-color .6s}
#themeBtn{padding:4px 9px;font-size:1rem;border-bottom-width:3px;text-transform:none;background:var(--card);border-color:var(--line);color:var(--ink)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px 12px 150px;gap:12px}
header{width:100%;max-width:640px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font-size:1.05rem;margin:0;font-weight:700}
.stats{display:flex;gap:12px;font-weight:700;font-size:.95rem}
#bar{width:100%;max-width:640px;height:12px;background:var(--line);border-radius:8px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:8px;transition:width .35s}
#card{width:100%;max-width:640px;background:var(--card);border:2px solid var(--line);border-radius:16px;overflow:hidden;animation:pop .25s}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.sec{padding:18px;text-align:center}
.sec h2{margin:0 0 8px;font-size:1.35rem}
.sec p{margin:8px 0;white-space:pre-wrap}
.sec img{max-width:100%;border-radius:10px;margin:8px 0}
.q{font-size:1.25rem}
.ans{font-size:1.5rem;font-weight:700;color:#1d4ed8}
html[data-theme=dark] .ans{color:#7cb7ff}
.expl{text-align:left;color:var(--muted);font-size:1rem}
#back{display:none;border-top:2px solid var(--line)}
#back.on{display:block;animation:pop .3s}
.audio{width:100%;margin-top:8px}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:2px solid var(--line);z-index:5}
.dock>div{width:100%;max-width:640px;display:grid;gap:8px}
#grades{grid-template-columns:repeat(2,1fr)}
button{font:inherit;font-weight:700;padding:13px 6px;border-radius:14px;border:2px solid transparent;border-bottom-width:4px;color:#fff;cursor:pointer;background:var(--accent);border-color:var(--accentd);text-transform:uppercase;letter-spacing:.03em;font-size:.85rem}
button:active{transform:translateY(2px);border-bottom-width:2px}
button.g{background:var(--card);color:var(--ink);border-color:var(--line)}
.b-again{background:var(--bad);border-color:var(--badd)}
.b-hard{background:var(--hard);border-color:#cc7a00}
.b-good{background:var(--accent);border-color:var(--accentd)}
.b-easy{background:var(--easy);border-color:#1590c8}
#grades,#cont,#tools{display:none}
#tools{grid-template-columns:repeat(3,1fr);max-width:640px;width:100%}
#tools button{font-size:.75rem;padding:9px 4px}
/* feedback sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;transform:translateY(110%);visibility:hidden;pointer-events:none;transition:transform .3s,visibility 0s .3s;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
#sheet.show{transform:none;visibility:visible;pointer-events:auto;transition:transform .3s}
#sheet.good{background:#d7ffb8;color:#3b7d00}
#sheet.bad{background:#ffdfe0;color:#b02020}
html[data-theme=dark] #sheet.good{background:#1f3a12;color:#b7f27a}html[data-theme=dark] #sheet.bad{background:#3d1a1d;color:#ffaaaa}
#sheet .in{width:100%;max-width:640px;display:flex;flex-direction:column;gap:10px}
#sheet .top{display:flex;align-items:center;gap:12px}
#msg{font-size:1.3rem;font-weight:800}
#sub{font-size:.9rem;opacity:.9}
#brain{width:108px;height:119px;flex:none;margin-top:-72px;overflow:visible}
#sheet.good #cont{background:var(--accent);border-color:var(--accentd)}
#sheet.bad #cont{background:var(--bad);border-color:var(--badd)}
/* brain moods */
.mouth-s,.mouth-f,.tear,.spark,.rays,.eyes-h,.eyes-s,.brow-h,.brow-s,.cheek,.armRu,.armLu,.armLd,.tongue{display:none}
.mouth-n{display:block}
.happy .mouth-n,.sad .mouth-n,.happy .hand,.sad .hand,.happy .eyes-n,.sad .eyes-n,.happy .brow-n,.sad .brow-n,.happy .armR{display:none}
.happy .mouth-s,.happy .eyes-h,.happy .brow-h,.happy .cheek,.happy .armRu,.happy .armLu,.happy .tongue{display:block}
.sad .mouth-f,.sad .tear,.sad .eyes-s,.sad .brow-s,.sad .armLd{display:block}
.happy .spark,.happy .rays{display:block;animation:tw .5s infinite alternate}
.happy .rays{transform-origin:66px 12px}
.happy .bulb{filter:drop-shadow(0 0 4px #ffd43b)}
.happy #bx{animation:hop .55s ease-in-out 4;transform-origin:50px 104px}
.sad #bx{animation:shk .5s ease-in-out 2;transform-origin:50px 104px}
.sad .bulb{opacity:.4;filter:grayscale(.6);transform:rotate(-18deg);transform-origin:66px 23px}
.tear{animation:fall .9s infinite}
.eyes-n{animation:blink 4s infinite;transform-origin:50px 52px}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes tw{from{opacity:.2;transform:scale(.6)}to{opacity:1;transform:scale(1.2)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}30%{transform:translateY(-22px) scale(.95,1.08) rotate(-6deg)}60%{transform:translateY(-22px) rotate(6deg)}80%{transform:scale(1.08,.9)}}
@keyframes shk{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg) translateX(-4px)}75%{transform:rotate(9deg) translateX(4px)}}
@keyframes fall{from{transform:translateY(0);opacity:1}to{transform:translateY(16px);opacity:0}}
.pupil{transition:transform .2s}
.conf{position:fixed;top:-12px;width:10px;height:14px;z-index:20;pointer-events:none;animation:cf 1.6s ease-in forwards}
@keyframes cf{to{transform:translateY(105vh) rotate(720deg);opacity:.9}}
#end{display:none;width:100%;max-width:640px;text-align:center;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:22px}
#end .endrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
#end button.g{color:var(--ink)}
#end button:disabled{opacity:.45;cursor:default}
.rep{text-align:left;margin-top:18px}
.rep h3{margin:14px 0 8px;font-size:1rem}
.rep ul{list-style:none;margin:0;padding:0}
.rep li{padding:9px 11px;border:2px solid var(--line);border-radius:10px;margin-bottom:6px;font-size:.92rem}
.rep li b{display:block}.rep li span{color:var(--muted)}
.rep li.w{border-color:#ff9b9b}.rep li.r{border-color:#9be26a}
.rep .fixed{color:#3b7d00;font-weight:700;font-size:.85rem;margin-top:2px}
html[data-theme=dark] .rep .fixed{color:#b7f27a}
.rep summary{cursor:pointer;font-weight:700;margin:14px 0 8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><h1 id="title">Flashcards</h1><div class="stats"><span id="streak">🔥 0</span><span id="xp">⭐ 0</span><span id="count"></span><button id="themeBtn" aria-label="Toggle dark mode">🌙</button></div></header>
<div id="bar"><i id="fill"></i></div>
<div id="info" class="sec">Loading deck…</div>
<div id="card" hidden>
  <div class="sec" id="front"></div>
  <div id="back"></div>
</div>
<div id="end">
  <svg id="endBrain" viewBox="0 0 100 110" width="120" height="132" class="happy"></svg>
  <h2 id="endTitle" style="margin:6px 0"></h2><p id="endText"></p>
  <div class="endrow"><button id="endMissed">Redo wrong ones</button><button class="g" id="endRestart">Start over</button></div>
  <div id="report" class="rep"></div>
</div>

<div class="dock" style="display:none"><div>
  <button id="show">Show answer</button>
  <div id="grades" style="display:none"></div>
  <div id="tools"><button class="g" id="shuf">Shuffle</button><button class="g" id="rst">Restart</button><button class="g" id="only">Missed only</button></div>
</div></div>

<div id="sheet"><div class="in">
  <div class="top"><svg id="brain" viewBox="0 0 100 110"></svg><div><div id="msg"></div><div id="sub"></div></div></div>
  <button id="cont">Continue</button>
</div></div>

<script>
// Light by default. Goes dark automatically in the evening (7pm-6am) unless you pick a theme with the button.
(function(){
  const root=document.documentElement, btn=document.getElementById("themeBtn");
  let saved=null; try{saved=localStorage.getItem("fc-theme")}catch(e){}
  const evening=()=>{const h=new Date().getHours();return h>=19||h<6};
  function apply(t){root.setAttribute("data-theme",t);btn.textContent=t==="dark"?"☀️":"🌙"}
  apply(saved||(evening()?"dark":"light"));
  btn.onclick=()=>{const t=root.getAttribute("data-theme")==="dark"?"light":"dark";apply(t);try{localStorage.setItem("fc-theme",t)}catch(e){}};
  if(!saved) setInterval(()=>apply(evening()?"dark":"light"),60000);
})();
</script>
<script>
// ===== Same Supabase URL as in js/config.js =====
const SUPABASE_URL = "https://xsduelyqbytddbfyfkiq.supabase.co";

// Deck JSON: {"title":"..","cards":[{"front":"Pulmonic area...","front_image":"https://..","back":"Single S2","explanation":"Normal in elderly...","back_image":"https://..","audio":"https://.."}]}
// Old decks with only front/back still work. If no "explanation", text after the first line of "back" is used as the explanation.
// ================================================

const EMBEDDED = {"title": "Sample Deck (test)", "subject": "Surgery", "cards": [{"front": "Which nerve is at risk during thyroidectomy and causes hoarseness if injured?", "back": "Recurrent laryngeal nerve", "tags": ["thyroid"]}, {"front": "Which gland's blood supply is at risk during total thyroidectomy, causing hypocalcaemia?", "back": "Parathyroid glands (inferior parathyroid supplied by the inferior thyroid artery)", "tags": ["thyroid"]}, {"front": "Most common type of thyroid cancer?", "back": "Papillary carcinoma", "tags": ["thyroid"]}]};
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
let MEDIA = {}, BASE = "", all = [], order = [], idx = 0, known = new Set(), missed = new Set(), first = {}, streak = 0, xp = 0, revealed = false, locked = false;

const BRAIN = `<g id="bx">
<ellipse cx="50" cy="106" rx="28" ry="3.5" fill="#000" opacity=".12"/>

<g fill="#f4a89d"><circle cx="30" cy="44" r="16"/><circle cx="50" cy="34" r="18"/><circle cx="70" cy="38" r="16"/><circle cx="78" cy="56" r="14"/><circle cx="22" cy="60" r="13"/><circle cx="36" cy="68" r="15"/><circle cx="62" cy="68" r="15"/><circle cx="50" cy="56" r="22"/></g>

<g fill="none" stroke="#e07f78" stroke-width="1.7" stroke-linecap="round"><path d="M30 34q6 4 4 10"/><path d="M44 22q4 6 11 6"/><path d="M62 28q-2 8 4 12"/><path d="M13 58q8-2 10 4"/><path d="M78 68q-6-2-8 4"/><path d="M38 76q5 3 10 1"/><path d="M82 44q-5 2-6 8"/><path d="M20 46q4-1 6 3"/></g>
<g class="hand"><path d="M62 78q-1-4-5-5" stroke="#2a1f20" stroke-width="3" stroke-linecap="round" fill="none"/><circle cx="55" cy="72.5" r="3.6" fill="#2a1f20"/></g>

<circle cx="64" cy="52" r="7.6" fill="#fff" stroke="#333" stroke-width="1"/><circle class="pupil" cx="66" cy="50" r="3.7" fill="#222"/><circle cx="67.2" cy="48.8" r="1.1" fill="#fff"/></g>

<g class="eyes-s"><circle cx="36" cy="53" r="7.8" fill="#fff" stroke="#333" stroke-width="1"/><circle cx="36" cy="55" r="5.2" fill="#222"/><circle cx="34" cy="52.6" r="1.9" fill="#fff"/><circle cx="38.6" cy="57.2" r="1" fill="#fff"/>
<circle cx="64" cy="53" r="7.8" fill="#fff" stroke="#333" stroke-width="1"/><circle cx="64" cy="55" r="5.2" fill="#222"/><circle cx="62" cy="52.6" r="1.9" fill="#fff"/><circle cx="66.6" cy="57.2" r="1" fill="#fff"/>
<path d="M28.5 58q7.5 6 15 0M56.5 58q7.5 6 15 0" fill="none" stroke="#4fc3f7" stroke-width="2.2" stroke-linecap="round" opacity=".85"/></g>
<g class="cheek" fill="#ff6f83" opacity=".6"><ellipse cx="24" cy="69" rx="5.5" ry="3.2"/><ellipse cx="76" cy="69" rx="5.5" ry="3.2"/></g>
<g fill="#fff" fill-opacity=".25" stroke="#1f1a1a" stroke-width="2.3"><circle cx="36" cy="52" r="11.5"/><circle cx="64" cy="52" r="11.5"/></g>
<path d="M47.5 50q2.5-3 5 0M25 49L10 44M75.5 49L91 45" fill="none" stroke="#1f1a1a" stroke-width="2.3" stroke-linecap="round"/>

<path class="mouth-n" d="M30 70q9 7 18 1" fill="none" stroke="#7a2a2a" stroke-width="2.6" stroke-linecap="round"/>
<path class="mouth-s" d="M33 66q17 22 34 0z" fill="#7a2a2a" stroke="#7a2a2a" stroke-width="2" stroke-linejoin="round"/>
<path class="tongue" d="M43 77q7 6 14 0q-7-4-14 0z" fill="#ff7a8a"/>
<path class="mouth-f" d="M37 79q13-14 26 0" fill="none" stroke="#7a2a2a" stroke-width="3" stroke-linecap="round"/>
<path class="tear" d="M29 62q-4 9 0 12q4-3 0-12z" fill="#4fc3f7"/><path class="tear" style="animation-delay:.45s" d="M71 62q-4 9 0 12q4-3 0-12z" fill="#4fc3f7"/>
<g class="bulb"><g class="rays" stroke="#ffc400" stroke-width="2" stroke-linecap="round"><path d="M66 0v-4M56 3l-3-3M76 3l3-3M53 12h-4M79 12h4"/></g>
<circle cx="66" cy="12" r="8" fill="#ffd93b" stroke="#e0a800" stroke-width="1.5"/><path d="M62.5 13q3.5-5 7 0" fill="none" stroke="#e0a800" stroke-width="1.4" stroke-linecap="round"/><rect x="62.2" y="19.5" width="7.6" height="4" rx="1.2" fill="#6b6b6b"/></g>
<g class="spark" fill="#ffd43b"><path d="M8 24l3 6 6 3-6 3-3 6-3-6-6-3 6-3z"/><path d="M92 20l2 5 5 2-5 2-2 5-2-5-5-2 5-2z"/><path d="M6 74l2 4 4 2-4 2-2 4-2-4-4-2 4-2z"/></g>
</g>`;
$("brain").innerHTML = BRAIN;
$("endBrain").innerHTML = BRAIN.replace('id="bx"','');

function setMood(m){ $("brain").setAttribute("class", m); }
function srcUrl(){
  if (q.get("url")) return q.get("url");
  const p = q.get("path");
  if (!p){ try{ return localStorage.getItem("fc-last-src"); }catch(e){ return null; } }
  return SUPABASE_URL.replace(/\/$/,"") + "/storage/v1/object/public/" + BUCKET + "/" + p.split("/").map(encodeURIComponent).join("/");
}
function say(t){ $("info").textContent = t; $("info").style.display = "block"; }

async function load(){
  const u = srcUrl() || "embedded-sample";
  try{
    let d;
    if (u === "embedded-sample") d = EMBEDDED;
    else { const r = await fetch(u); if (!r.ok) throw new Error("HTTP " + r.status); d = await r.json(); }
    if (!d || !Array.isArray(d.cards) || !d.cards.length) throw new Error("No cards in file");
    MEDIA = d.media || {}; BASE = (u === "embedded-sample") ? "" : u.replace(/[^\/]*$/, "");
    all = d.cards.filter(c => c && c.front && c.back);
    $("title").textContent = d.title || "Flashcards";
    document.title = (d.title || "Flashcards") + " – Flashcards";
    $("info").style.display = "none";
    try{ localStorage.setItem("fc-last-src", u); }catch(e){}
    if (!restore()) start(all.map((_, i) => i));
  }catch(e){ say("Could not load the deck (" + e.message + "). Check the file path and that the bucket is public."); }
}

function el(tag, cls, txt){ const e = document.createElement(tag); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; }
function img(src){ const i = el("img"); i.src = src; i.alt = ""; i.loading = "lazy"; return i; }

const KEY = () => "fc-progress:" + (srcUrl() || "embedded-sample");
function save(i){ try{ localStorage.setItem(KEY(), JSON.stringify({v:1,n:all.length,order,idx:i,known:[...known],missed:[...missed],first,streak,xp})); }catch(e){} }
function restore(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY()) || "null");
    if (!s || s.v !== 1 || s.n !== all.length || !Array.isArray(s.order) || !s.order.length || s.order.some(i => !(i >= 0 && i < all.length))) return false;
    order = s.order; idx = Math.max(0, Math.min(s.idx|0, order.length)); known = new Set(s.known || []); missed = new Set(s.missed || []);
    first = s.first || {}; streak = s.streak || 0; xp = s.xp || 0;
    $("info").style.display = "none"; $("card").hidden = false; document.querySelector(".dock").style.display = "flex";
    if (idx >= order.length) finish(true); else show();
    return true;
  }catch(e){ return false; }
}
function start(list, keep){
  if (!all.length) return load();
  order = list.slice(); idx = 0;
  if (!keep){ known = new Set(); missed = new Set(); first = {}; streak = 0; xp = 0; }
  $("end").style.display = "none"; $("card").hidden = false; document.querySelector(".dock").style.display = "flex";
  show(); save(0);
}
function show(){
  const c = all[order[idx]]; revealed = false; locked = false;
  if (!c){ $("card").hidden = true; return say("Could not show this card. Tap Start over or reload the deck."); }
  const f = $("front"); f.replaceChildren();
  if (c.front_image) f.append(img(c.front_image));
  f.append(el("p","q",c.front));
  const b = $("back"); b.classList.remove("on"); b.replaceChildren();
  let ans = c.back, ex = c.explanation || "";
  if (!ex && ans.includes("\n")){ const k = ans.indexOf("\n"); ex = ans.slice(k+1).trim(); ans = ans.slice(0,k).trim(); }
  const s = el("div","sec"); s.append(el("p","ans",ans));
  if (c.back_image) s.append(img(c.back_image));
  const mu = n => { n = (n && n.name) ? (n.data || n.name) : n; return MEDIA[n] || (/^(data:|https?:|\/)/.test(n) ? n : BASE + "media/" + n); };
  if (c.explanation_html){
    const h = el("div","expl");
    h.innerHTML = c.explanation_html.replace(/src="([^"]+)"/g, (m, n) => 'src="' + mu(n) + '"');
    s.append(h);
  } else if (Array.isArray(c.images) && !c.back_image){
    c.images.forEach(n => s.append(img(mu(n))));
  }
  if (ex) s.append(el("p","expl",ex));
  if (c.audio){ const a = el("audio","audio"); a.controls = true; a.src = c.audio; s.append(a); }
  b.append(s);
  $("show").style.display = "block"; $("grades").style.display = "none"; $("tools").style.display = "none";
  $("count").textContent = (idx+1) + "/" + order.length;
  $("fill").style.width = (idx / order.length * 100) + "%";
  $("streak").textContent = "🔥 " + streak; $("xp").textContent = "⭐ " + xp;
  window.scrollTo({top:0});
}
function reveal(){
  if (revealed) return; revealed = true;
  $("back").classList.add("on");
  $("show").style.display = "none"; $("grades").style.display = "grid"; $("tools").style.display = "grid";
  $("back").scrollIntoView({behavior:"smooth",block:"nearest"});
}
const GRADES = [["again","✗ Wrong"],["good","✓ Right"]];
GRADES.forEach(([k,l]) => { const b = el("button","b-"+k,l); b.dataset.k = k; b.onclick = () => grade(k); $("grades").append(b); });

const GOOD = [["Nice one!","Your brain is on fire."],["Correct!","Look at you go."],["Brainy move!","Keep that streak alive."],["Nailed it!","Big brain energy."]];
const BAD = [["Oops!","Totally fine, it'll come back around."],["Not yet!","Mistakes are how memory is built."],["Brain freeze!","We'll see this one again."]];
const pick = a => a[Math.floor(Math.random()*a.length)];

function grade(k){
  if (locked || !all.length) return; locked = true;
  const id = order[idx], ok = k !== "again", sh = $("sheet");
  if (!(id in first)) first[id] = ok;
  if (ok){ known.add(id); missed.delete(id); streak++; xp += 10; }
  else { missed.add(id); known.delete(id); streak = 0; }
  const [m,s2] = pick(ok ? GOOD : BAD);
  $("msg").textContent = m; $("sub").textContent = s2;
  sh.className = "show " + (ok ? "good" : "bad"); setMood(ok ? "happy" : "sad");
  $("streak").textContent = "🔥 " + streak; $("xp").textContent = "⭐ " + xp;
  $("cont").style.display = "block"; $("cont").focus();
  if (ok) confetti(30);
  if (navigator.vibrate) navigator.vibrate(ok ? 20 : [40,40,40]);
  save(idx + 1);
}
function next(){
  $("sheet").className = ""; $("cont").style.display = "none"; setMood("");
  if (idx + 1 >= order.length) return finish();
  idx++; show();
}
function confetti(n){
  const cols = ["#58cc02","#ffd43b","#1cb0f6","#ff4b4b","#f9a8c0","#ff9600"];
  for (let i=0;i<n;i++){
    const c = el("i","conf"); c.style.left = Math.random()*100+"vw"; c.style.background = pick(cols);
    c.style.animationDelay = Math.random()*.4+"s"; c.style.animationDuration = 1.2+Math.random()+"s";
    document.body.append(c); setTimeout(() => c.remove(), 2800);
  }
}
function trunc(t,n){ t = (t||"").replace(/\s+/g," ").trim(); return t.length > n ? t.slice(0,n-1) + "…" : t; }
function ansOf(c){ let a = c.back; if (!c.explanation && a.includes("\n")) a = a.slice(0, a.indexOf("\n")); return a.trim(); }
function report(){
  const r = $("report"); r.replaceChildren();
  const ids = Object.keys(first).map(Number).sort((a,b) => a-b);
  const wrong = ids.filter(i => first[i] === false), right = ids.filter(i => first[i] === true);
  const item = (i, cls) => {
    const c = all[i], li = el("li", cls);
    li.append(el("b","",trunc(c.front,110)), el("span","","Answer: " + trunc(ansOf(c),110)));
    if (first[i] === false && known.has(i)) li.append(el("div","fixed","✓ Fixed on redo"));
    return li;
  };
  r.append(el("h3","","✗ Wrong (" + wrong.length + ")"));
  if (wrong.length){ const u = el("ul"); wrong.forEach(i => u.append(item(i,"w"))); r.append(u); }
  else r.append(el("p","","Nothing wrong. 🎉"));
  const d = el("details"); d.append(el("summary","","✓ Right (" + right.length + ")"));
  const u2 = el("ul"); right.forEach(i => u2.append(item(i,"r"))); d.append(u2); r.append(d);
}
function finish(silent){
  $("card").hidden = true; document.querySelector(".dock").style.display = "none";
  $("fill").style.width = "100%";
  const ids = Object.keys(first), nR = ids.filter(i => first[i]).length, nW = ids.length - nR;
  const allGood = missed.size === 0;
  $("endBrain").setAttribute("class", allGood ? "happy" : "");
  $("endTitle").textContent = allGood ? (nW === 0 ? "Perfect!" : "All fixed!") : "Deck finished";
  $("endText").textContent = nR + " right · " + nW + " wrong" + (missed.size ? " · " + missed.size + " still to fix" : "") + " · +" + xp + " XP";
  $("endMissed").disabled = missed.size === 0; $("end").style.display = "block";
  report(); save(order.length); window.scrollTo({top:0});
  if (allGood && !silent) confetti(80);
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

$("show").onclick = reveal; $("front").onclick = reveal; $("cont").onclick = next;
const ALL = () => all.map((_, i) => i);
let armed = null;
function twoTap(btn, fn){
  btn.onclick = () => {
    if (armed === btn){ clearTimeout(btn._t); btn.textContent = btn._old; armed = null; fn(); return; }
    if (armed){ clearTimeout(armed._t); armed.textContent = armed._old; }
    armed = btn; btn._old = btn.textContent; btn.textContent = "Tap again to confirm";
    btn._t = setTimeout(() => { btn.textContent = btn._old; armed = null; }, 3000);
  };
}
twoTap($("shuf"), () => start(shuffle(ALL())));
twoTap($("rst"), () => start(ALL()));
$("endRestart").onclick = () => start(ALL());
$("only").onclick = () => { if (missed.size) start([...missed], true); };
$("endMissed").onclick = () => { if (missed.size) start([...missed], true); };
document.addEventListener("keydown", e => {
  if (e.key === " " || e.key === "Enter"){
    if ($("sheet").classList.contains("show")){ e.preventDefault(); next(); }
    else if (!revealed){ e.preventDefault(); reveal(); }
  } else if (revealed && !locked && !$("sheet").classList.contains("show")){
    const m = {"1":"again","2":"good","ArrowLeft":"again","ArrowRight":"good"}[e.key]; if (m) grade(m);
  }
});
load();
</script>
</body>
